<!DOCTYPE html>
<html>
<head>
    <title>Factorial Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            margin-top: 100px;
        }

        .container {
            background: white;
            width: 350px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            padding: 8px;
            width: 200px;
            margin: 10px;
        }

        button {
            padding: 8px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        #result {
            margin-top: 15px;
            color: blue;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Factorial Calculator</h2>

        <input type="number" id="num" placeholder="Enter a number">
        <br>

        <button onclick="findFactorial()">Calculate</button>

        <h3 id="result"></h3>
    </div>

    <script>
        function findFactorial() {
            let n = document.getElementById("num").value;
            let fact = 1;

            for (let i = 1; i <= n; i++) {
                fact *= i;
            }

            document.getElementById("result").innerHTML =
                "Factorial of " + n + " is " + fact;
        }
    </script>

</body>
</html>
